name: Android Native Smoke

concurrency:
  group: android-native-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [android-port]
    paths:
      - "Native/**"
      - ".github/workflows/android-native-smoke.yml"
  workflow_dispatch:

jobs:
  arm64-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Native
          sparse-checkout-cone-mode: true
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Configure ARM64
        run: |
          cmake -S Native -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build Idas3Unity
        run: cmake --build build-android --target Idas3Unity --parallel 2
      - name: Upload ARM64 native plugin
        uses: actions/upload-artifact@v4
        with:
          name: Idas3Unity-Android-arm64
          path: Assets/Plugins/Android/arm64-v8a/libIdas3Unity.so
          if-no-files-found: error
          retention-days: 14
